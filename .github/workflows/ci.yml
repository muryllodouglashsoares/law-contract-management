name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções anteriores do mesmo branch/PR quando um novo push chega,
# evitando gastar minutos de CI validando um código já superado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  backend:
    name: Backend (typecheck, test, build)
    runs-on: ubuntu-latest

    # Testes de integração (tests/integration) sobem a aplicação via
    # app.inject() e usam um banco PostgreSQL de teste real — o próprio
    # backend/vitest.config.ts já assume essa dependência
    # (DATABASE_URL padrão aponta para lexcontract_test em localhost:5432).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lexcontract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lexcontract_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm ci já executa o postinstall (prisma generate) do projeto.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck (lint)
        run: npm run typecheck

      - name: Apply database migrations
        run: npm run db:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lexcontract_test?schema=public
          # schema.prisma declara directUrl = env("DIRECT_URL"); o Prisma CLI
          # exige a variável mesmo sem pooler. No CI (Postgres local) ela é
          # idêntica à DATABASE_URL.
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/lexcontract_test?schema=public

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lexcontract_test?schema=public

      - name: Build
        run: npm run build

  docker:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t lexcontract-frontend:ci .

      - name: Build backend image
        run: docker build -t lexcontract-backend:ci ./backend
