services:
  postgres:
    image: postgres:16-alpine
    container_name: lexcontract-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lexcontract
    ports:
      - '5432:5432'
    volumes:
      - lexcontract_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lexcontract']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: runtime
    container_name: lexcontract-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lexcontract?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no seu .env antes de subir o compose}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3333:3333'
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  lexcontract_postgres_data:
