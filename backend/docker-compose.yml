services:
  postgres:
    image: postgres:16-alpine
    container_name: lexcontract-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lexcontract
    ports:
      - '5432:5432'
    volumes:
      - lexcontract_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lexcontract']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: runtime
    container_name: lexcontract-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lexcontract?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/lexcontract?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no seu .env antes de subir o compose}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Storage: `local` (padrão, disco do container) ou `neon-s3` (defina S3_* no seu .env).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # Cron diário (GitHub Actions) e aceite eletrônico por link público. Todos opcionais em dev.
      CRON_SECRET: ${CRON_SECRET:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      PUBLIC_SIGNATURE_EXPIRATION_HOURS: ${PUBLIC_SIGNATURE_EXPIRATION_HOURS:-72}
      # Web Push (opcional; as três juntas). Gere com: npx web-push generate-vapid-keys --json
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    ports:
      - '3333:3333'
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  lexcontract_postgres_data:
