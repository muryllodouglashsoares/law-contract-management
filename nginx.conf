# Configuração Nginx para servir o build estático do frontend (SPA).
#
# O ponto importante é o `try_files` do location "/": como o React Router
# controla as rotas no client-side (ex.: /dashboard, /clientes, /contratos,
# /modelos), o Nginx precisa devolver sempre index.html para qualquer rota
# desconhecida — senão um acesso direto ou um F5 nessas URLs retorna 404,
# já que esses caminhos não existem como arquivos reais em disco.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão para os estáticos gerados pelo Vite.
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Assets com hash no nome (dist/assets/*) podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback de SPA: qualquer rota não encontrada como arquivo estático
    # cai em index.html, deixando o React Router decidir o que renderizar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Página pública de aceite eletrônico (/assinar/<token>): o token está na URL, então sem
    # Referer, sem indexação e sem cache. add_header em `location` substitui os do nível superior.
    location /assinar/ {
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.html;
    }

    # Nunca cachear o index.html — ele referencia os assets com hash mais
    # recente; cacheá-lo faria o usuário ficar preso a uma versão antiga.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
